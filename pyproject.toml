[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txncat"
version = "0.1.0"
description = "Card-transaction categorisation: ML baseline vs LLM vs hybrid, with an evaluation harness"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.9.1",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.40",          # Moonshot/Kimi exposes an OpenAI-compatible API
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
